name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The engine is plain C++17 with no platform code, so it must compile AND
  # render the same everywhere. Running the same steps on Linux, macOS and
  # Windows is what stops "portable" from quietly becoming "compiles on the
  # machine it was written on". Runners are pinned rather than "-latest" so a
  # runner image changing underneath cannot turn the badge red on its own.
  cli:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: "CLI + tests (Linux, gcc)" }
          - { os: macos-14,     name: "CLI + tests (macOS, clang/arm64)" }
          - { os: windows-2022, name: "CLI + tests (Windows, MSVC)" }
    steps:
      - uses: actions/checkout@v7

      - name: CMake configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate the tools
        shell: bash
        run: |
          # Multi-config generators (MSVC, Xcode) put binaries in a subdirectory;
          # single-config ones (Make, Ninja) do not.
          for t in reborn_render reborn_roundtrip; do
            for p in build/Release/$t.exe build/Release/$t build/$t; do
              if [ -x "$p" ]; then echo "$(echo $t | tr a-z A-Z)=$p" >> "$GITHUB_ENV"; break; fi
            done
          done
          if ! grep -q REBORN_RENDER "$GITHUB_ENV" || ! grep -q REBORN_ROUNDTRIP "$GITHUB_ENV"; then
            echo "tools not found"; find build -name 'reborn_*'; exit 1
          fi

      - name: Smoke render (built-in demo song)
        shell: bash
        run: |
          "$REBORN_RENDER" --seconds 1 --out smoke.wav
          test -s smoke.wav

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Documentation check (links, private paths, dashes)
        if: runner.os == 'Linux'
        run: python tools/check_docs.py

      - name: Install numpy
        run: python -m pip install --quiet numpy

      - name: Generate the baseline fixtures
        shell: bash
        env:
          REBORN_WORKSPACE: ${{ runner.temp }}/workspace
        run: |
          mkdir -p "$REBORN_WORKSPACE"
          python tools/rbsgen/gen_batchG.py
          python tools/rbsgen/gen_batchH.py

      # The real portability check. Fixtures come from committed code, so this
      # needs nothing outside the repo, and it compares MEASURED audio against
      # the reference baseline rather than merely checking a file appeared.
      #
      # Bit-identical output across compilers is NOT expected: MSVC and clang
      # differ on FMA contraction and reassociation. The tolerances (0.05 dB,
      # 0.5%) are far wider than that and far tighter than any law this project
      # states, so a failure here is a real behavioural change, not float noise.
      # Any change to the 303's DSP moves this baseline and must re-record it on
      # Windows (tools/measure/platform_baseline.py record).
      - name: Platform baseline vs the Windows reference
        shell: bash
        env:
          REBORN_WORKSPACE: ${{ runner.temp }}/workspace
        run: |
          python tools/measure/platform_baseline.py check \
            "$REBORN_RENDER" "$REBORN_WORKSPACE" docs/baselines/windows-x86_64.json

      # Load, save, reload: the decoded model must survive. The writer states every
      # track's start as a tick-0 dump, so a generated fixture comes back with more
      # tick-0 events than it had; the harness reports those as restated, and the
      # step after it proves they change nothing by rendering original and copy
      # with the same binary and requiring identical files.
      - name: Round-trip the generated fixtures
        shell: bash
        env:
          REBORN_WORKSPACE: ${{ runner.temp }}/workspace
        run: |
          mkdir -p "$RUNNER_TEMP/resaved"
          "$REBORN_ROUNDTRIP" --save-dir "$RUNNER_TEMP/resaved" "$REBORN_WORKSPACE"/fixtures-*/batchH/*.rbs

      - name: Re-saved fixtures render identically
        shell: bash
        env:
          REBORN_WORKSPACE: ${{ runner.temp }}/workspace
        run: |
          n=0
          for f in $(ls "$REBORN_WORKSPACE"/fixtures-*/batchH/*.rbs | head -6); do
            b=$(basename "$f")
            "$REBORN_RENDER" --song "$f" --seconds 4 --out "$RUNNER_TEMP/orig.wav" > /dev/null
            "$REBORN_RENDER" --song "$RUNNER_TEMP/resaved/$b" --seconds 4 --out "$RUNNER_TEMP/copy.wav" > /dev/null
            cmp "$RUNNER_TEMP/orig.wav" "$RUNNER_TEMP/copy.wav"
            n=$((n + 1))
          done
          echo "$n re-saved fixtures render identically"

  # The JUCE app and both plugins (Standalone, VST3, CLAP), and the headless
  # session harness. Windows is the platform they were developed and tested on.
  app-windows:
    name: "App + plugins (Windows, MSVC)"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: CMake configure (fetches JUCE and clap-juce-extensions)
        run: cmake -S . -B build-app -DREBORN_BUILD_APP=ON

      - name: Build the app, the plugins and the smoke harnesses
        run: >
          cmake --build build-app --config Release --parallel
          --target RebornApp_Standalone RebornApp_VST3 RebornApp_CLAP
          Open303Plugin_Standalone Open303Plugin_VST3 Open303Plugin_CLAP
          reborn_session_smoke reborn_host_smoke

  # Linux and macOS builds of the app have never been run by the project's
  # author, so they run only when asked for (Actions, "Run workflow") and do not
  # gate the badge. A contributor bringing either up should make it a push job.
  # The name is static so a skipped run does not show an unexpanded expression;
  # GitHub appends the runner to it. The macOS job also builds the AU.
  app-other:
    name: App + plugins on request, unverified
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-14 ]
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages JUCE needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: CMake configure
        run: cmake -S . -B build-app -DCMAKE_BUILD_TYPE=Release -DREBORN_BUILD_APP=ON

      - name: Build
        run: cmake --build build-app --config Release --parallel
